name: Android Integration Tests

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ main ]
# we have some extra configurations on github repository settings in order to block merge when the action fails
# see settings / rules

jobs:
  android_test:
    runs-on: ubuntu-latest
    # runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true  # Caches Flutter SDK automatically

      # - name: Set up JDK 19
      #   run: |
      #     cd /tmp
      #     curl -O https://download.java.net/java/GA/jdk19.0.1/afdd2e245b014143b62ccb916125e3ce/10/GPL/openjdk-19.0.1_linux-x64_bin.tar.gz
      #     tar -xzvf openjdk-19.0.1_linux-x64_bin.tar.gz
      #     sudo mv jdk-19.0.1 /usr/lib/jvm
      #     flutter config --jdk-dir /usr/lib/jvm/jdk-19.0.1
      #     rm -rf ~/.gradle
          

      - name: Restore pub cache
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Setup emulator
        uses: android-actions/setup-android@v2
      
      - name: Create emulator
        run: |
          echo "no" | avdmanager create avd -n test -k "system-images;android-30;google_apis;x86_64" --device "pixel"
          emulator -avd test -no-window -no-audio -no-boot-anim -accel off &

      - name: Wait for emulator
        run: |
          adb wait-for-device
          adb shell input keyevent 82

      - name: Run integration tests
        run: flutter test integration_test/app_test.dart
            

