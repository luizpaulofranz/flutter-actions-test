name: Android Integration Tests

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ main ]
# we have some extra configurations on github repository settings in order to block merge when the action fails
# see settings / rules

jobs:
  android_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore pub cache
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2
        with:
          cmdline-tools-version: 9477386
          packages: |
            system-images;android-29;google_apis;x86_64
            platforms;android-29
            platform-tools
            emulator
            build-tools;33.0.2

      - name: Install system image
        run: sdkmanager "system-images;android-29;google_apis;x86_64"

      - name: Create AVD and start emulator
        run: |
          echo "no" | avdmanager create avd -n test -k "system-images;android-29;google_apis;x86_64" --device "pixel"
          $ANDROID_HOME/emulator/emulator -avd test -no-audio -no-window -no-boot-anim -gpu swiftshader_indirect -accel off &
          adb wait-for-device
          adb shell input keyevent 82
          echo "Emulator booted."

      - name: Disable animations
        run: |
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Run integration test
        run: flutter test integration_test/app_test.dart --timeout=3600s

      - name: Kill emulator
        if: always()
        run: adb emu kill
